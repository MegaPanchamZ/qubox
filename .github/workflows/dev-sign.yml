name: Dev signing dry-run

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  gpg-detach-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxrandr-dev libxdo-dev libxkbcommon-dev \
            libwayland-dev libxext-dev libclang-18-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavfilter-dev libavdevice-dev \
            libpulse-dev libdbus-1-dev libasound2-dev \
            autoconf automake libtool \
            libssl-dev libudev-dev libopus-dev \
            libpipewire-0.3-dev libspa-0.2-dev libsystemd-dev \
            pkg-config

      - name: Build release binaries (linux)
        run: |
          cargo build --release -p qubox-daemon -p qubox-host-agent -p qubox-client-cli

      - name: Generate ephemeral GPG key + sign
        run: |
          export GNUPGHOME=$(mktemp -d)
          cat >"$GNUPGHOME/key.batch" <<'EOF'
          %no-protection
          Key-Type: RSA
          Key-Length: 3072
          Name-Real: Qubox CI Dev
          Name-Email: ci-dev@qubox.local
          Expire-Date: 0
          %commit
          EOF
          gpg --batch --generate-key "$GNUPGHOME/key.batch"
          KEY=$(gpg --list-keys --with-colons | awk -F: '/^pub/ {print $5; exit}')
          for f in target/release/qubox-daemon target/release/qubox-host-agent target/release/qubox-client-cli; do
            gpg --local-user "$KEY" --detach-sign --armor "$f"
            test -f "${f}.asc"
            gpg --verify "${f}.asc" "$f"
          done
          echo "Dev GPG signing dry-run OK for key $KEY"

      - name: Note on production certs
        run: |
          echo "Production Authenticode/notarization requires org certs — see ops/signing/README.md"
